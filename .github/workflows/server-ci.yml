name: Server CI

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'apps/OpenSignServer/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/OpenSignServer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSignServer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint

      - name: Run server tests
        run: npm test
