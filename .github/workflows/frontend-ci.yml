name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'apps/OpenSign/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/OpenSign
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSign/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build
